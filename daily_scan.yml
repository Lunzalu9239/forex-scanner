name: Daily scan

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC = 08:00 Nairobi, Monday to Friday
  workflow_dispatch:         # lets you also start it manually with a button

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas numpy

      - name: Run scanner
        run: python scanner.py > last_scan.txt

      - name: Save results back to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Daily scan" || echo "Nothing new to save"
          git push
